name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Lint
        run: ruff check src tests scripts

      - name: Check generated SQL is current
        run: python scripts/dump_schema_sql.py --check

      # The scan CSV is committed, so CI runs the real import, the real ranking
      # query and the real trend queries. No NUPACK licence needed for any of it.
      - name: Smoke test the pipeline end to end
        run: |
          make import
          make rank
          make trends
