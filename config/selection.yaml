# Selection criteria. Every value here becomes a bind parameter in
# sql/select_candidates.sql, so the query text never changes between runs and
# the resolved values are snapshotted onto the selections row.

# The condition to rank at. It has to exist in the database or selection stops
# with an error rather than returning an empty list.
condition:
  temperature_c: 37.0
  na_molar: 0.15
  mg_molar: 0.0
  material: "dna04"
  ensemble: "stacking"

# Ranking is by delta_g_binding, most positive first, so the top of the
# shortlist is where binding is most disrupted. The bounds below are a window on
# that same column: raise min_delta_g_binding to keep only the badly disrupted
# designs, lower max_delta_g_binding to exclude ones that have stopped binding
# altogether.
thresholds:
  min_delta_g_binding: -30.0
  max_delta_g_binding: 0.0
  # Shift against the unmutated design at the same truncation. Positive means
  # the change cost binding. Set above 0 to keep only disruptive changes.
  min_ddg: 0.0
  gc_min: 0.0
  gc_max: 1.0
  trunc_total_min: 0
  trunc_total_max: 99
  num_mutations_min: 0
  num_mutations_max: 2

limits:
  per_class_cap: 5      # stops one variant class filling the whole shortlist
  n_final: 20
