# Sweep grid. The runner takes the full cross product of these lists, so the
# cell count is the product of the lengths (5 x 3 x 3 x 1 x 1 = 45 conditions).
#
# Adding a value here does not invalidate existing results. The next sweep only
# computes the cells that are missing, so widening the grid costs the difference
# rather than the whole thing.

temperature_c: [25.0, 30.0, 37.0, 45.0, 55.0]   # covers storage, design and stress
na_molar: [0.05, 0.15, 1.0]                     # low salt, physiological, high salt
mg_molar: [0.0, 0.002, 0.01]                    # typical buffer range
material: ["dna04"]                             # NUPACK parameter set
ensemble: ["stacking"]                          # coaxial and dangle stacking
